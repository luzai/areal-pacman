# Four-GPU diagnostic config for official AReaL main.
# It intentionally keeps the official framework source unmodified. The
# The 2026-07-23 OpenAI-proxy run reached real RGB rollout but omitted Qwen-VL
# mm_token_type_ids and multi_modal_input. This revised probe uses the
# recipe-owned native multimodal workflow so the actor/reference receive the
# exact processor tensors used for rollout. It remains a compatibility smoke,
# not an accepted production training config.
recipe_version: maapacman-level1-v1
artifact_root: run_artifacts/level1_official_areal_smoke
trajectory_dir: ${artifact_root}/trajectories
experiment_name: maapacman-official-areal-smoke
trial_name: qwen2p5-vl-3b-single-step-wall

seed: 1
enable_offload: false
enable_thinking: false
validation_contract: greedy1
image_prompt_style: wall_avoidance_axis_v3
total_train_epochs: 2
tokenizer_path: ${actor.path}
workflow: areal_pacman.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
parse_failure_penalty: -1
step_penalty: 0.0
wall_penalty: 0.0
nearest_pellet_alpha: 0.0
allow_unoffloaded_actor_colocated_ref_for_smoke: true
observation_mode: rgb
action_token_choice: false
completion_api: chat

cluster:
  n_nodes: 1
  n_gpus_per_node: 4
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d2p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 2
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 4
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 0.95

eval_gconfig:
  n_samples: 1
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: true
  temperature: 0.0
  top_p: 1.0

actor:
  backend: "fsdp:d2p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-VL-3B-Instruct
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: float32
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer:
    type: adam
    lr: 2.0e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: batch
    std_level: batch
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: false
  fsdp:
    offload_params: false
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.35
  enforce_eager: true

train_dataset:
  batch_size: 4
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: run_artifacts/wall_avoidance_balanced_dataset/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 1
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: run_artifacts/wall_avoidance_balanced_dataset/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
