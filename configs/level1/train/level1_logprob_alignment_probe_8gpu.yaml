recipe_version: maapacman-level1-ghostdoor-v3
artifact_root: artifacts/workbench/probes/level1_edward_logprob_alignment_probe
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: level1-edward-logprob-alignment-probe-qwen3p5-9b

seed: 1
# Short-horizon reward-trend run:
# - both train and validation dataset rows must use max_steps=32
# - no scheduled validation rollouts
# - training samples at temperature=0.7, top_p=1.0
# - no nearest-pellet distance shaping
# - screenshot plus live engine state and bounded navigation history
# - every generated action is masked to current open movement actions
enable_offload: true
enable_thinking: false
validation_contract: greedy1
reward_objective_contract: episode_return_group_v1
image_prompt_style: live_state_v3
# The production recipe requires at least two epochs. lr=0 keeps both epochs
# on the identical checkpoint while giving the audit two independent batches.
total_train_epochs: 2
tokenizer_path: ${actor.path}
workflow: areal_pacman.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
contract_violation_return: -1.0
step_penalty: 1.0
wall_penalty: 1.0
nearest_pellet_alpha: 0.0
observation_mode: rgb
action_token_choice: false
open_action_mask: false
edward_options: true
objective_encoding: edward-option-code-v1
completion_api: chat

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

eval_gconfig:
  # A valid nominal contract is required even though evaluator is disabled.
  n_samples: 1
  min_new_tokens: 1
  max_new_tokens: 1
  max_tokens: 1024
  greedy: true
  temperature: 0.0
  top_p: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  offload: true
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer:
    type: adam
    # Keep weights bit-identical throughout the probe. The audit is captured
    # before ppo_update, but lr=0 also prevents later calls from drifting.
    lr: 0.0
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.01
  kl_logprob_source: proximal
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  prox_logp_method: recompute
  rejection_sampling:
    level: sequence
    action: mask
    metric: ratio
    agg: sum
    lower: 0.8
    upper: 1.25
  reward_norm:
    mean_level: group
    mean_leave1out: false
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  temperature: ${actor.temperature}
  mb_spec:
    max_tokens_per_mb: 1024
  optimizer: null
  offload: true
  fsdp:
    offload_params: true
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  gdn_prefill_backend: triton
  logprobs_mode: processed_logprobs

train_dataset:
  # Four dataset rows in one batch means one update per epoch (two total).
  batch_size: 4
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/level1_dataset_logprob_alignment/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 2
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: artifacts/datasets/level1_dataset_logprob_alignment/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
