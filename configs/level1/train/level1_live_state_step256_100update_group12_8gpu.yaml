recipe_version: maapacman-level1-v1
artifact_root: run_artifacts/level1_live_state_openmask_step256_100update
trajectory_dir: ${artifact_root}/trajectories
experiment_name: pacman-agentic-rl
trial_name: level1-live-state-openmask-step256-qwen3p5-9b-100update-group12

seed: 1
# Longer-episode reward-trend run:
# - 8 train rows / batch size 4 = 2 updates per epoch
# - 50 epochs = 100 total updates
# - both train and validation dataset rows must use max_steps=256
# - no scheduled validation rollouts
# - training samples at temperature=0.7, top_p=1.0
# - explicit +1 normal-pellet, +1 power-pellet, and +50 completion rewards
# - BFS nearest-pellet guidance only at or below 25% remaining normal pellets
# - screenshot plus live engine state and bounded navigation history
# - every generated action is masked to current open movement actions
# - save every 10 updates to bound checkpoint storage
# - TMS alternates the colocated actor and reference model: actor is offloaded
#   during rollout/ref log-prob, then reference is offloaded before actor update
enable_offload: true
enable_thinking: false
validation_contract: sampled12_uniform_shaped
image_prompt_style: live_state_v3
total_train_epochs: 50
tokenizer_path: ${actor.path}
workflow: areal_pacman.workflow.PacmanNativeVisionWorkflow
eval_workflow: ${workflow}
parse_failure_penalty: -50
use_base_reward: false
normal_pellet_reward: 1.0
power_pellet_reward: 1.0
completion_reward: 50.0
step_penalty: 0.05
wall_penalty: 0.5
nearest_pellet_alpha: 0.1
nearest_pellet_remaining_ratio_threshold: 0.25
nearest_pellet_skip_on_eat: true
observation_mode: rgb
action_token_choice: true
open_action_mask: true
completion_api: chat

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: ${artifact_root}/training
  name_resolve:
    type: nfs
    nfs_record_root: ${artifact_root}/name_resolve

scheduler:
  type: local

rollout:
  backend: "vllm:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0
    admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}

gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 3
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

eval_gconfig:
  n_samples: 12
  min_new_tokens: 1
  max_new_tokens: 3
  max_tokens: 1024
  greedy: false
  temperature: 0.7
  top_p: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  offload: true
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer_dtype: bfloat16
  mb_spec:
    # 640 tokens left too little headroom for NCCL's grad-norm all-reduce.
    # 512 covers the observed <=493-token samples while preserving the
    # effective batch, and completed the first PPO update on the 8-GPU run.
    max_tokens_per_mb: 512
  optimizer:
    type: adam_bf16
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.05
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.01
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  optimizer_dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 512
  optimizer: null
  offload: true
  fsdp:
    offload_params: true
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  gpu_memory_utilization: 0.65
  enforce_eager: true
  logprobs_mode: processed_logprobs

train_dataset:
  batch_size: 4
  shuffle: true
  pin_memory: true
  num_workers: 0
  path: run_artifacts/level1_dataset_step256/train_hf
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 2
  shuffle: false
  pin_memory: true
  num_workers: 0
  path: run_artifacts/level1_dataset_step256/validation_hf
  type: rl
  max_length: 1024

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
