[project]
name = "areal-pacman"
version = "0.1.0"
description = "AReaL image-only reinforcement-learning recipe for MaaPacman"
requires-python = ">=3.10"
dependencies = [
  "maapacman>=0.4,<0.5",
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]
agent = ["openai"]
dataset = ["datasets"]
h100-offload = [
  "torch-memory-saver==0.0.9.post1; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
include = ["areal_pacman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
